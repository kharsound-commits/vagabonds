:root{--text:#f4f7ff;--muted:#bdcbe0;--gold:#f6c632;--accent:#ff8a3d;--ok:#6fe38a;--bad:#ff6b6b;
--slab1:#2b4060;--slab2:#1f2f47;--grass:#62c454;--grass2:#3f9a3a;--rust:#d07a3a;--rust2:#9a4e22;
--wood1:#a06b3e;--wood2:#7a4c28;--wood3:#55331a;--cream:#fff3dc;
--c-commune:#9a9aa3;--c-rare:#3b7dd8;--c-ultra:#8a4fd6;--c-legend:#d4a62a;--c-mythic:#e8e8f4}
*{box-sizing:border-box}
html{background:#4aa3e8}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Rubik',system-ui,sans-serif;
 background:linear-gradient(180deg,#3d95e0 0%,#7cc4f4 38%,#bfe4fb 62%,#ffd9b8 88%,#ffc2a6 100%) fixed}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,.title{font-family:'Vagabonds Forge','Bangers','Rubik',sans-serif;letter-spacing:1px;font-weight:400;margin:0}
.ts{text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 2px 4px #000}

/* ---------- ciel ---------- */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:var(--w,180px);height:calc(var(--w,180px)*.32);background:#fff;border-radius:999px;opacity:var(--o,.85);
 filter:blur(1px);animation:drift var(--t,90s) linear infinite;animation-delay:var(--d,0s)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:46%;height:140%;left:16%;top:-70%}
.cloud::after{width:34%;height:110%;left:52%;top:-48%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.islet{position:absolute;width:var(--w,90px);height:calc(var(--w,90px)*.9);opacity:.55;animation:bob 7s ease-in-out infinite;animation-delay:var(--d,0s)}
.islet::before{content:"";position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(#7fd06d,#4c9d3f);border-radius:50% 50% 30% 30%/80% 80% 20% 20%}
.islet::after{content:"";position:absolute;left:8%;right:8%;top:18%;bottom:0;background:linear-gradient(#8a6142,#5a3c26);clip-path:polygon(0 0,100% 0,78% 40%,62% 30%,50% 100%,38% 45%,22% 60%)}
@keyframes bob{50%{transform:translateY(-10px)}}

/* ---------- en-tête ---------- */
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 14px 80px}
header.top{position:sticky;top:0;z-index:20;background:rgba(22,48,86,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid rgba(255,255,255,.25)}
header.top .in{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:34px;margin-right:auto}
.gold{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#ffe27a,#f2b51e);border:2px solid #8a5a00;color:#3a2400;padding:5px 14px;border-radius:999px;font-weight:700;box-shadow:0 3px 0 #8a5a00}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
nav.tabs button{background:linear-gradient(var(--wood1),var(--wood2));color:var(--cream);border:2px solid var(--wood3);border-radius:10px;padding:8px 14px;font-weight:700;min-height:44px;box-shadow:0 3px 0 var(--wood3);transition:transform .1s}
nav.tabs button:hover{transform:translateY(-2px)}
nav.tabs button.on{background:linear-gradient(#ffe27a,#f2b51e);color:#3a2400;border-color:#8a5a00;box-shadow:0 3px 0 #8a5a00}

/* ---------- boutons ---------- */
.btn{background:linear-gradient(#ffa25a,#ff7a2a);color:#2a1000;border:2px solid #a8460f;border-radius:14px;padding:11px 18px;font-weight:700;font-size:16px;min-height:44px;box-shadow:0 4px 0 #a8460f;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #a8460f}
.btn.sec{background:linear-gradient(var(--wood1),var(--wood2));color:var(--cream);border-color:var(--wood3);box-shadow:0 4px 0 var(--wood3)}
.btn.sec:active:not(:disabled){box-shadow:0 1px 0 var(--wood3)}
.btn.gold{background:linear-gradient(#ffe27a,#f2b51e);color:#3a2400;border-color:#8a5a00;box-shadow:0 4px 0 #8a5a00}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:14px;min-height:40px}

/* ---------- panneaux = petites îles ---------- */
.panel{position:relative;background:linear-gradient(var(--slab1),var(--slab2));border-radius:24px;padding:18px 18px 20px;margin:26px 0 64px;
 border-top:10px solid var(--grass);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 18px 30px rgba(30,60,110,.25)}
.panel::before{content:"";position:absolute;left:10px;right:10px;top:-18px;height:12px;
 background:radial-gradient(circle at 6px 12px,var(--grass) 6px,transparent 7px) 0 0/14px 12px repeat-x;pointer-events:none}
.panel::after{content:"";position:absolute;left:14%;right:14%;top:100%;height:46px;pointer-events:none;
 background:linear-gradient(#8a6142,#4f331f);clip-path:polygon(0 0,100% 0,92% 38%,82% 24%,72% 70%,61% 42%,50% 100%,40% 52%,30% 78%,20% 34%,9% 52%)}
.panel.four{border-top-color:var(--rust)}
.panel.four::before{background:radial-gradient(circle at 6px 12px,var(--rust) 6px,transparent 7px) 0 0/14px 12px repeat-x}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.hero{text-align:center;padding-top:26px}
.hero h1{font-size:56px;color:var(--gold);text-shadow:2px 2px 0 #5a3200,-2px -2px 0 #5a3200,2px -2px 0 #5a3200,-2px 2px 0 #5a3200,0 5px 0 #5a3200}
.hero p{max-width:640px;margin:10px auto}
.hero .row{justify-content:center}
.stats{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap;text-align:center}
.stats b{display:block;font-family:'Vagabonds Forge','Bangers';font-size:38px;color:var(--gold);letter-spacing:1px}

/* ---------- cartes ---------- */
.card{position:relative;aspect-ratio:2/3;border-radius:12px;border:6px solid var(--c-commune);overflow:hidden;background:#223 center top/cover no-repeat;color:#fff;cursor:pointer;user-select:none;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform .15s}
.grid .card:hover{transform:translateY(-4px) rotate(-1deg)}
.card.rare{border-color:var(--c-rare)}.card.ultra{border-color:var(--c-ultra)}.card.legend{border-color:var(--c-legend);box-shadow:0 0 16px rgba(242,194,48,.6),0 6px 14px rgba(0,0,0,.35)}
.card .nm{position:absolute;left:6px;top:4px;right:42px;font-family:'Vagabonds Forge','Bangers';font-size:20px;line-height:1.05}
.card .pv{position:absolute;right:6px;top:4px;font-family:'Vagabonds Forge','Bangers';font-size:20px;text-align:right;line-height:1}
.card .pv small{display:block;font-family:'Rubik';font-size:9px;font-weight:700}
.card .el{position:absolute;left:6px;top:28px;filter:drop-shadow(0 0 2px #000)}
.card .bot{position:absolute;left:0;right:0;bottom:0;padding:5px 6px;font-size:11px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.card .cnt{position:absolute;right:6px;bottom:24px;background:var(--gold);color:#241a00;font-weight:700;font-size:12px;border-radius:999px;padding:1px 7px}
.card .lvl{position:absolute;left:6px;bottom:24px;background:#000a;border:1px solid var(--gold);color:var(--gold);font-weight:700;font-size:11px;border-radius:999px;padding:1px 6px}
.card .camp{position:absolute;left:32px;top:28px;filter:drop-shadow(0 0 2px #000)}
.card.locked{filter:grayscale(1) brightness(.35)}
.card.locked::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Vagabonds Forge','Bangers';font-size:60px;color:#fff6}
.card.stade .nm{right:6px;font-size:17px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(0,0,0,.35);color:#fff}
.tag.new{background:var(--ok);color:#06240f}

/* ---------- plateau de combat ---------- */
.board{position:relative;margin:8px 0 0;padding-bottom:110px;animation:bob 8s ease-in-out infinite}
.isle-top{position:relative;border-radius:46px;padding:16px 14px;overflow:hidden;
 background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%) 0 0/56px 56px,radial-gradient(ellipse at 50% 40%,#79d266,#3f9a3a 75%);
 border:4px solid #2f7a2c;border-bottom:16px solid #7a5232;box-shadow:inset 0 4px 0 rgba(255,255,255,.25),0 24px 40px rgba(30,60,110,.3)}

body{background:linear-gradient(rgba(10,16,32,.5),rgba(10,16,32,.72)),url(img/ui_bg.jpg) center/cover fixed #0d1424}

.sky{display:none}
header.top{background:rgba(10,14,26,.7)}

/* ---------- scènes illustrées ---------- */
body.scenemode .wrap{max-width:none;padding:10px 10px 40px}
.scene-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.scene{position:relative;container-type:inline-size;width:min(100%,calc((100vh - 140px)*16/9));min-width:var(--minw,0px);aspect-ratio:16/9;margin:0 auto;
 background:#111 center/100% 100% no-repeat;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.hot{position:absolute}
.fg{font-family:'Vagabonds Forge','Bangers',sans-serif;letter-spacing:.06em}
.engr{color:#3a2a14;text-shadow:0 1px 0 rgba(255,255,255,.55)}

.scene .card .el,.scene .card .camp{top:1.8cqw}.scene .card .el{left:.4cqw}.scene .card .camp{left:1.9cqw}

.tgrid{overflow-y:auto;padding:1cqw 1.2cqw;display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2cqw,1fr));gap:1cqw;align-content:start;scrollbar-color:#a07c3a #2a1c10}
.tcell{position:relative}
.tcell .add{position:absolute;right:-.3cqw;bottom:-.3cqw;width:2cqw;height:2cqw;border-radius:50%;border:.15cqw solid #3a2400;background:linear-gradient(#ffe27a,#f2b51e);color:#3a2400;font-weight:700;font-size:1.4cqw;line-height:1;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tcell.in .card{outline:.25cqw solid #6fe38a}
.tinfo{text-align:center;color:#fff3d6;font-size:1.2cqw;text-shadow:0 1px 3px #000;background:rgba(12,10,8,.72);border:.1cqw solid rgba(216,180,80,.6);border-radius:99px;padding:.3cqw 1.2cqw;width:auto!important;left:50%!important;transform:translateX(-50%);white-space:nowrap}
.tinfo b{font-family:'Vagabonds Forge','Bangers',sans-serif;font-size:1.8cqw;letter-spacing:.08em;color:#ffd75a}
.tempty{grid-column:1/-1;color:#e8d3ad;font-size:1.3cqw;text-align:center;padding:2cqw}
/* histoire */
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.4cqw;background:none;border:none;padding:0;cursor:pointer;color:#fff}
.mk .md{width:5cqw;height:5cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4cqw;color:#3a2400;
 background:radial-gradient(circle at 35% 30%,#fff1a8,#f2b51e 60%,#a8700a);border:.3cqw solid #5a3200;box-shadow:0 .4cqw 0 #5a3200,0 0 2cqw rgba(255,200,80,.6)}
.mk .lb{font-size:1.3cqw;white-space:nowrap;padding:.25cqw .9cqw;border-radius:.4cqw;background:rgba(14,18,30,.82);border:.12cqw solid #d8b450;color:#fff4d8}
.mk.cur .md{animation:mkpulse 1.6s ease-in-out infinite}
@keyframes mkpulse{50%{box-shadow:0 .4cqw 0 #5a3200,0 0 4cqw 1cqw rgba(255,220,120,.85)}}
.mk.done .md{background:radial-gradient(circle at 35% 30%,#d9ffd9,#6fe38a 60%,#2c8a45);border-color:#174a26;box-shadow:0 .4cqw 0 #174a26}
.mk.lock .md{background:radial-gradient(circle at 35% 30%,#999,#555 60%,#333);border-color:#222;box-shadow:0 .4cqw 0 #222;color:#ddd}
.mk.lock .lb{opacity:.75}
.mk:hover .md{transform:scale(1.08)}
.mk.next .md{background:radial-gradient(circle at 35% 30%,#b9a3e8,#5b3a9a 60%,#2a1550);border-color:#170a30;color:#e8dcff;box-shadow:0 0 3cqw rgba(160,110,255,.7)}
.scene-note{position:absolute;left:1.5cqw;bottom:1.5cqw;max-width:30cqw;font-size:1.1cqw;color:#fff3d6;background:rgba(10,12,22,.7);border:.1cqw solid rgba(216,180,80,.6);border-radius:.6cqw;padding:.8cqw 1cqw}
.scene-title{position:absolute;left:1.5cqw;top:1.5cqw;font-size:2.6cqw;color:#ffe6b0;text-shadow:0 2px 6px #000,0 0 18px rgba(0,0,0,.8)}
/* combats libres */
.fb{container-type:inline-size;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;transition:transform .2s}
.fb:hover{transform:scale(1.05)}
.fb .plate{display:flex;flex-direction:column;align-items:center;gap:2cqw;max-width:100%;max-height:100%;overflow:hidden;padding:4cqw 5cqw;border-radius:6cqw;
 background:rgba(14,16,26,.86);border:1px solid rgba(216,180,80,.75);box-shadow:0 2cqw 5cqw rgba(0,0,0,.5);text-align:center}
.fb .tn{font-size:11cqw;line-height:1.05;color:#ffe6b0;letter-spacing:.05em;overflow-wrap:anywhere}
.fb .av3{display:flex;gap:2.5cqw}
.fb .av3 i{width:16cqw;height:16cqw;border-radius:50%;background:#333 center 15%/cover;border:1.2cqw solid #d8b450}
.fb .gn{font-size:8.5cqw;font-weight:700;color:#fff3d6;white-space:nowrap}
.fb .ok{color:#6fe38a}
.fb.empty{cursor:default}
.fpager{position:absolute;left:50%;bottom:4cqw;transform:translateX(-50%);display:flex;align-items:center;gap:1.4cqw;font-size:2.4cqw;color:#ffe6b0;text-shadow:0 2px 6px #000}
.fpager button{width:3.6cqw;height:3.6cqw;font-size:1.6cqw;border-radius:50%;padding:0;min-height:0;display:flex;align-items:center;justify-content:center}
/* tirage */
.gacha-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 20px;text-align:center}
.gacha-stage h1{font-size:44px;color:#ffe6b0;text-shadow:0 2px 8px #000}
.gacha-stage p{max-width:560px;margin:0;color:#fff3d6;text-shadow:0 1px 3px #000}
.pack-btn{background:none;border:none;padding:0;cursor:pointer}
.gbtn{font-size:1.5cqw;padding:.8cqw 2.2cqw;min-height:0;white-space:nowrap}
.pack-btn:disabled{cursor:not-allowed;filter:grayscale(.7) brightness(.7)}


/* ---------- arène de combat ---------- */
.arena .fslot{display:flex;align-items:center;justify-content:center}
.arena .fighter{position:relative;height:100%;background:none;border:none;padding:0;box-shadow:none;display:flex;justify-content:center;animation:none}
.arena .fcard{position:relative;height:100%;aspect-ratio:2/3;transition:transform .25s,filter .25s}
.arena .fcard .card{height:100%;width:100%;aspect-ratio:auto;border-width:.3cqw;border-radius:.6cqw;box-shadow:0 .5cqw 1cqw rgba(0,0,0,.55)}
.arena .card .nm{font-size:.78cqw;left:.3cqw;top:.25cqw;right:2.1cqw;overflow:hidden;white-space:nowrap;text-overflow:clip}
.arena .card .pv{font-size:.95cqw;right:.3cqw;top:.2cqw}.arena .card .pv small{font-size:.45cqw}
.arena .card .el,.arena .card .camp{top:1.35cqw}.arena .card .el{left:.3cqw}.arena .card .camp{left:1.4cqw}
.arena .card .el svg,.arena .card .camp svg{width:1cqw;height:1cqw}
.arena .card .bot{display:none}
.arena .hpb{position:absolute;left:.3cqw;right:.3cqw;bottom:.3cqw;height:1.05cqw;background:rgba(0,0,0,.75);border-radius:99px;overflow:hidden;border:.08cqw solid #000}
.arena .hpb i{display:block;height:100%;background:#6fe38a;transition:width .4s}.arena .hpb i.mid{background:#f6c632}.arena .hpb i.low{background:#ff5b5b}
.arena .hpb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72cqw;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.arena .spok{position:absolute;right:-.5cqw;top:-.5cqw;font-size:.65cqw;font-weight:700;background:linear-gradient(#ffe27a,#f2b51e);color:#3a2400;border-radius:99px;padding:.1cqw .4cqw;border:.08cqw solid #3a2400;z-index:2}
.arena .st{position:absolute;left:50%;bottom:-1.3cqw;transform:translateX(-50%);display:flex;gap:.2cqw;white-space:nowrap;min-height:0;margin:0}
.arena .st span{font-size:.6cqw;background:rgba(0,0,0,.75);border-radius:.3cqw;padding:.05cqw .3cqw;color:#fff}
.arena .fighter.can .fcard{box-shadow:0 0 0 .25cqw #6fe38a,0 0 1.4cqw rgba(111,227,138,.7);border-radius:.6cqw;cursor:pointer;animation:ready 1.6s ease-in-out infinite}
.arena .fighter.sel .fcard{box-shadow:0 0 0 .3cqw #ffd75a,0 0 2cqw #ffd75a;border-radius:.6cqw;transform:translateY(-.8cqw) scale(1.06)}
.arena .fighter.tgt .fcard{box-shadow:0 0 0 .3cqw #ff5b5b,0 0 1.6cqw rgba(255,90,90,.8);border-radius:.6cqw;cursor:crosshair;animation:pulse2 1s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 .5cqw rgba(255,90,90,.5),0 0 2.6cqw rgba(255,90,90,.9)}}
.arena .fighter.done .fcard{filter:brightness(.6) saturate(.7)}
.arena .fighter.dead .fcard{filter:grayscale(1) brightness(.35);transform:scale(.92) rotate(-3deg)}
.arena .fighter.dying .fcard{animation:dying .8s ease-in forwards}
.arena .fighter.dying .hpb,.arena .fighter.dying .spok{opacity:.4}
@keyframes dying{0%{filter:none;transform:none}30%{filter:brightness(2) saturate(0);transform:scale(1.06)}100%{filter:grayscale(1) brightness(.35);transform:scale(.92) rotate(-3deg)}}
.arena .fighter.hitfx .fcard{animation:hitshake .4s}
@keyframes hitshake{0%{filter:brightness(2.2) sepia(1) hue-rotate(-30deg) saturate(4)}20%{transform:translate(-.6cqw,.2cqw) rotate(-2deg)}45%{transform:translate(.6cqw,-.2cqw) rotate(2deg)}70%{transform:translate(-.3cqw,0)}100%{transform:none;filter:none}}
.arena .fighter.casting .fcard{animation:cast .7s ease-out}
@keyframes cast{0%{box-shadow:0 0 0 0 var(--ec)}40%{box-shadow:0 0 2cqw 1cqw var(--ec);transform:scale(1.08) translateY(-.6cqw)}100%{box-shadow:0 0 0 0 transparent}}
.arena .fighter.burst::after{content:"";position:absolute;left:50%;top:50%;width:14cqw;height:14cqw;margin:-7cqw 0 0 -7cqw;border-radius:50%;pointer-events:none;z-index:3;
 background:radial-gradient(circle,#fff 0,var(--ec) 25%,transparent 65%);mix-blend-mode:screen;animation:burst2 .7s ease-out forwards}
@keyframes burst2{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.3);opacity:0}}
.arena .fighter.drop .fcard{animation:drop .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{transform:translateY(-30cqw) scale(1.3);opacity:0}60%{opacity:1}100%{transform:none}}
.pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:6;pointer-events:none;font-family:'Vagabonds Forge','Bangers',sans-serif;font-size:2.4cqw;letter-spacing:.04em;white-space:nowrap;
 text-shadow:0 .15cqw 0 #000,0 0 .6cqw #000;animation:popup 1.2s ease-out forwards}
.pop.dm{color:#ff5b4a}.pop.hl{color:#6fe38a}.pop.tx{color:#fff;font-size:1.6cqw}
@keyframes popup{0%{opacity:0;transform:translate(-50%,0) scale(.4)}15%{opacity:1;transform:translate(-50%,-1cqw) scale(1.25)}30%{transform:translate(-50%,-1.5cqw) scale(1)}100%{opacity:0;transform:translate(-50%,-5cqw)}}
.rcase{width:auto;height:100%;aspect-ratio:2/3;border:.18cqw dashed rgba(255,255,255,.5);border-radius:.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-size:.85cqw;text-align:center;background:rgba(0,0,0,.25)}
.rcase b{font-size:3cqw;color:#fff;font-weight:400}
.turnk{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#ffd75a;text-shadow:0 .1cqw 0 #3a2400,0 0 .8cqw rgba(0,0,0,.8)}
.turnk small{font-size:.9cqw;letter-spacing:.15em}.turnk b{font-size:3.6cqw;font-weight:400}
.sslot{display:flex;align-items:center;justify-content:center}.sslot .card{height:100%;width:auto;aspect-ratio:2/3;cursor:pointer;border-width:.3cqw;border-radius:.6cqw}
.sslot .card .nm{font-size:.95cqw}.sslot .card .el{top:1.4cqw}.sslot .card .el svg{width:1cqw;height:1cqw}.sslot .card .bot{font-size:.5cqw}
.sinfo{display:flex;flex-direction:column;gap:.2cqw;max-width:24cqw;background:rgba(10,12,22,.78);border:.08cqw solid rgba(216,180,80,.7);border-radius:.6cqw;padding:.5cqw .9cqw;color:#fff3d6;font-size:.85cqw}
.sinfo b{font-size:1.25cqw;font-weight:400;color:#ffd75a;letter-spacing:.06em}
.alog{left:1.2%;top:56%;width:20%;height:41%;overflow-y:auto;background:rgba(10,12,22,.8);border:.08cqw solid rgba(216,180,80,.6);border-radius:.7cqw;padding:.6cqw .8cqw;font-size:.78cqw;line-height:1.45;color:#e9e1cf}
.alog .p{color:#8fc4ff}.alog .e{color:#ff9b7a}.alog .s{color:#ffd75a;font-weight:700}
.abar{left:24%;top:85.5%;width:52%}
.arena .actions{background:rgba(10,12,22,.88);border:.1cqw solid rgba(216,180,80,.75);border-radius:.8cqw;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.6);padding:.7cqw 1cqw;margin:0;color:#fff3d6;font-size:1cqw}
.arena .actions::before,.arena .actions::after{content:none}
.arena .actions .muted{color:#d8cdb4}
.arena .actions .row{gap:.6cqw;margin-top:.5cqw!important}
.arena .actions .btn{font-size:.95cqw;padding:.45cqw .9cqw;min-height:0;border-radius:.6cqw;border-width:.12cqw;box-shadow:0 .25cqw 0 #a8460f;flex:1 1 auto}
.arena .actions .btn.sec{box-shadow:0 .25cqw 0 var(--wood3)}.arena .actions .btn.gold{box-shadow:0 .25cqw 0 #8a5a00}
.arena .actions .btn.sm{flex:0 0 auto}
.arena .actions h2{font-size:2.4cqw!important}
.arena .actions p{margin:.3cqw 0}

/* ---------- animations d'attaque ---------- */
.fxl{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.fxl>div{position:absolute}
.slash{transform:translate(-50%,-50%);filter:drop-shadow(0 0 4px var(--ec)) drop-shadow(0 0 10px var(--ec))}
.slash svg{width:100%;height:100%;overflow:visible}
.slash path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:slashdraw .5s ease-out forwards}
.slash path:nth-child(2){animation-delay:.05s}.slash path:nth-child(3){animation-delay:.1s}
@keyframes slashdraw{0%{stroke-dashoffset:120;opacity:1}45%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.shock{transform:translate(-50%,-50%) scale(.2);border-radius:50%;border:4px solid var(--ec);box-shadow:0 0 18px var(--ec),inset 0 0 18px var(--ec);animation:shock .6s ease-out forwards}
@keyframes shock{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.pt{width:var(--s);height:var(--s);transform:translate(-50%,-50%);background:var(--c);border-radius:50%;box-shadow:0 0 8px var(--c);animation:ptfly .85s cubic-bezier(.2,.8,.3,1) forwards}
.pt.flame{border-radius:50% 50% 50% 0;background:radial-gradient(circle at 60% 40%,#fff3b0,var(--c) 60%)}
.pt.drop{border-radius:0 50% 50% 50%;background:radial-gradient(circle at 40% 40%,#e6f4ff,var(--c) 65%)}
.pt.leaf{border-radius:0 80% 0 80%;width:calc(var(--s)*1.5)}
.pt.wisp{width:calc(var(--s)*2.4);height:calc(var(--s)*.5);border-radius:99px;background:rgba(255,255,255,.9)}
.pt.spark{width:calc(var(--s)*.6);height:calc(var(--s)*.6);background:#fff;box-shadow:0 0 6px #fff,0 0 12px var(--c)}
.pt.smoke{width:calc(var(--s)*2);height:calc(var(--s)*2);background:radial-gradient(circle,var(--c),rgba(30,0,50,0) 70%);box-shadow:none;opacity:.8}
@keyframes ptfly{0%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.2) rotate(var(--r));opacity:0}}
.zbolt{width:22px;transform:translateX(-50%);filter:drop-shadow(0 0 4px #ffd33d) drop-shadow(0 0 10px #ffd33d);animation:zb .5s steps(1) forwards;opacity:0}
.zbolt svg{width:100%;height:100%}.zbolt path,.beam path{fill:none;stroke:#fff;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
@keyframes zb{0%{opacity:1}20%{opacity:.2}35%{opacity:1}60%{opacity:.6}100%{opacity:0}}
.beam{height:26px;transform-origin:0 50%;filter:drop-shadow(0 0 4px #ffd33d) drop-shadow(0 0 12px #ffd33d);animation:zb .45s steps(1) forwards}
.beam svg{width:100%;height:100%}
.orb{transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0 15%,var(--c) 45%,transparent 72%);box-shadow:0 0 22px 6px var(--c),0 0 50px 10px var(--c)}
.orb.leaf{border-radius:0 80% 0 80%}
.orb.smoke{background:radial-gradient(circle,#fff 0 8%,#7a3ccf 35%,rgba(20,0,40,.6) 70%,transparent 75%)}
.cutin{inset:0;position:absolute}
.ci-band{position:absolute;left:-10%;right:-10%;top:36%;height:28%;background:linear-gradient(90deg,rgba(8,8,16,.92),rgba(8,8,16,.82) 60%,rgba(8,8,16,.92));border-top:4px solid var(--ec);border-bottom:4px solid var(--ec);
 box-shadow:0 0 30px var(--ec);transform:skewY(-4deg) scaleX(0);animation:band 1s cubic-bezier(.2,1,.3,1) forwards}
.from-r .ci-band{transform-origin:100% 50%}.from-l .ci-band{transform-origin:0 50%}
@keyframes band{0%{transform:skewY(-4deg) scaleX(0);opacity:1}22%{transform:skewY(-4deg) scaleX(1)}80%{transform:skewY(-4deg) scaleX(1);opacity:1}100%{transform:skewY(-4deg) scaleX(1);opacity:0}}
.ci-art{position:absolute;top:28%;height:44%;aspect-ratio:2/3;background:#222 center top/cover;border:3px solid var(--ec);border-radius:8px;box-shadow:0 0 24px var(--ec);opacity:0}
.from-l .ci-art{left:14%;animation:artl 1s cubic-bezier(.2,1,.3,1) forwards}
.from-r .ci-art{right:14%;animation:artr 1s cubic-bezier(.2,1,.3,1) forwards}
@keyframes artl{0%{transform:translateX(-60%) rotate(-8deg);opacity:0}25%{transform:none;opacity:1}80%{opacity:1;transform:translateX(4%)}100%{opacity:0;transform:translateX(30%)}}
@keyframes artr{0%{transform:translateX(60%) rotate(8deg);opacity:0}25%{transform:none;opacity:1}80%{opacity:1;transform:translateX(-4%)}100%{opacity:0;transform:translateX(-30%)}}
.ci-txt{position:absolute;top:40%;display:flex;flex-direction:column;line-height:1;opacity:0}
.from-l .ci-txt{left:26%;animation:txtl 1s cubic-bezier(.2,1,.3,1) forwards}
.from-r .ci-txt{right:26%;text-align:right;animation:txtr 1s cubic-bezier(.2,1,.3,1) forwards}
.ci-txt small{font-weight:700;letter-spacing:.3em;color:#fff;font-size:1.1cqw}
.ci-txt b{font-weight:400;font-size:4.2cqw;letter-spacing:.06em;color:#fff;text-shadow:0 0 12px var(--ec),0 0 30px var(--ec),0 3px 0 #000}
@keyframes txtl{0%{transform:translateX(30%);opacity:0}30%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(-8%)}}
@keyframes txtr{0%{transform:translateX(-30%);opacity:0}30%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(8%)}}
.arena .fighter.casting .fcard{animation:cast2 1s ease-out}
@keyframes cast2{0%{box-shadow:0 0 0 0 var(--ec)}30%{box-shadow:0 0 2.4cqw 1.2cqw var(--ec);transform:scale(1.1) translateY(-.8cqw)}85%{box-shadow:0 0 1.6cqw .6cqw var(--ec);transform:scale(1.08) translateY(-.6cqw)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.arena .fighter.burst::after{display:none}

/* ---------- boutons son ---------- */
.sndbtns{display:flex;gap:6px}
.sb{width:40px;height:40px;border-radius:50%;border:2px solid #8a5a00;background:linear-gradient(#ffe27a,#f2b51e);color:#3a2400;font-size:17px;line-height:1;padding:0;cursor:pointer;box-shadow:0 3px 0 #8a5a00;display:flex;align-items:center;justify-content:center}
.sb.off{background:linear-gradient(#5a5f6a,#3a3e47);border-color:#22252b;color:#aab;box-shadow:0 3px 0 #22252b;text-decoration:line-through}
/* ---------- écran de victoire / défaite ---------- */
.endov{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:endfade .5s ease-out both}
@keyframes endfade{from{opacity:0}to{opacity:1}}
.endov.win{background:radial-gradient(ellipse at 50% 45%,rgba(30,20,4,.75),rgba(6,8,16,.93) 70%)}
.endov.lose{background:radial-gradient(ellipse at 50% 45%,rgba(60,6,6,.6),rgba(4,4,8,.94) 70%);backdrop-filter:grayscale(.85);-webkit-backdrop-filter:grayscale(.85)}
.endrays{position:absolute;left:50%;top:42%;width:150cqw;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,210,90,.11) 0 6deg,transparent 6deg 18deg);
 -webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);animation:spinr 22s linear infinite}
@keyframes spinr{to{transform:translate(-50%,-50%) rotate(360deg)}}
.endcrack{position:absolute;inset:0;background:linear-gradient(115deg,transparent 48%,rgba(255,60,40,.25) 49.5%,transparent 51%),linear-gradient(70deg,transparent 60%,rgba(255,60,40,.18) 61%,transparent 62%);animation:endfade 1.2s .4s both}
.endin{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.2cqw;text-align:center;color:#fff3d6}
.endtitle{font-size:9cqw;letter-spacing:.08em;line-height:1;animation:endslam .7s .15s cubic-bezier(.2,1.5,.4,1) both}
.win .endtitle{color:#ffd75a;text-shadow:0 0 2.5cqw rgba(255,190,60,.9),0 .5cqw 0 #5a3200,0 1cqw 2cqw rgba(0,0,0,.6)}

rle. On vous attendait."], ["Kent", "Axel… Je regardais tous tes combats quand j'étais petit."], ["Ash", "(à Matt) Moi aussi, je viens du Four. Ne laisse personne te dire que tu n'as pas ta place ici."]], "after": [["Axel", "Vous m'avez battu. Je suis fier d'avoir perdu contre vous. Mais la finale vous attend : Sang Noir."]]}]}, {"t": "Rivalité", "w": "haut", "reward": "Zoe", "zoeLink": 1, "f": [{"team": ["Rebel", "Zoe", "Big", "Erik", "Mad", "Sim"], "before": [["Rebel", "Les finalistes… Des âmes intéressantes. Surtout la tienne, Kent."], ["Matt", "Zoé ! C'est moi, Matt ! Ton frère !"], ["Zoé", "Je ne te connais pas. Je fais partie de Sang Noir."]], "after": [["Rebel", "Pas mal. Mais ce n'était qu'un échauffement."], ["Big", "Cette fois, on ne retient plus nos coups !"]]}, {"team": ["Rebel", "Zoe", "Big", "Erik", "Mad", "Sim"], "before": [["Erik", "Deuxième manche. Le public en veut plus."], ["Mad", "… Le vent tourne. Pour vous."]], "after": [["Sim", "Ils tiennent encore debout…"], ["Rebel", "Assez joué. Sang Noir, libérez vos âmes. Montrons-leur notre vraie puissance."]], "lvl": 3}, {"team": ["L_Rebel", "L_Zoe", "L_Big", "L_Erik", "L_Mad", "L_Sim"], "before": [["Rebel", "Voici ce que Sang Noir est vraiment. Aucune équipe n'a jamais vu cette forme et n'est restée debout."], ["Matt", "Zoé… si tu es encore là quelque part, souviens-toi."]], "after": [["Zoé", "Matt… ? Le cerf-volant rouge… Je me souviens de toi."], ["Matt", "Je t'avais promis de venir te chercher."], ["Zoé", "Je reste avec Sang Noir pour l'instant… Mais quand on combattra ensemble, je serai à tes côtés."], ["Rebel", "Garde-la, si tu veux. J'ai trouvé une âme bien plus intéressante. N'est-ce pas, Kent ?"]]}]}, {"t": "Rébellion", "w": "haut", "f": [{"team": ["Magnus", "Nyx", "Aldo", "Orin", "Iris", "Selva"], "before": [["Magnus", "Le garçon à l'œil. Ce pendentif appartenait au vieux fou que nous avons chassé. Donne-le-moi, et je t'offre une place au Conseil."], ["Kent", "Non. Je ne suis plus le garçon ti const MUS = {mode:null, timer:null, step:0, next:0};
const PROG = {battle:[[50,53,57],[46,50,53],[53,57,60],[48,52,55]], menu:[[50,53,57],[46,50,53],[43,46,50],[45,49,52]]};
const MELO = [[74,72,69,72],[70,69,65,62],[67,69,70,74],[73,72,69,69]];
function musTick(){
 const c = SND.ctx; if(!c || !MUS.mode) return;
 const battle = MUS.mode==='battle', bpm = battle ? 140 : 72, st = 60/bpm/4;
 while(MUS.next < c.currentTime + .3){
  const t0 = MUS.next, s = MUS.step, bar = Math.floor(s/16) % 4, phrase = Math.floor(s/64), b = s % 16, ch = PROG[MUS.mode][bar];
  if(SND.mus){
   if(battle){
    // cordes ostinato
    const pat = [0,0,12,0, 0,12,0,7, 0,0,12,0, 7,12,7,3][b];
    [-8,8].forEach(det => voice({mus:1, t0, f:NOTE(ch[0]-12+pat), type:'sawtooth', det, dur:st*.9, vol:.05, att:.004, ft:'lowpass', ff:1900, rev:.15}));
    if(b===0){ ch.forEach(n => [-10,10].forEach(det => voice({mus:1, t0, f:NOTE(n-12), type:'sawtooth', det, dur:st*16, vol:.035, att:.15, hold:st*10, ft:'lowpass', ff:700, rev:.4})));
     voice({mus:1, t0, f:NOTE(ch[0]-24), type:'sawtooth', dur:st*14, vol:.08, att:.02, ft:'lowpass', ff:220, rev:.2});
     // cuivres
     ch.forEach(n => [-6,6].forEach(det => voice({mus:1, t0, f:NOTE(n), type:'sawtooth', det, dur:st*3, vol:.045, att:.02, ft:'lowpass', ff:400, fto:2800, fdur:.08, rev:.4})));
     if(bar===0) B.choir(t0 - c.currentTime, ch.map(n => n+12), st*64*.95, .035, true);
    }
    // taiko
    if([0,3,6,8,10,11,14].includes(b)) B.taiko(t0 - c.currentTime, b===0||b===8 ? .85 : .5, true);
    if(b%2===1) voice({mus:1, t0, noise:1, ft:'highpass', ff:8000, dur:.04, vol:.05});
    if(b===12 && bar===3) voice({mus:1, t0, noise:1, ft:'highpass', ff:4000, dur:st*4, vol:.12, att:st*4*.9, rev:.6});
    // mélodie héroïque une phrase sur deux
    if(phrase%2===1 && b%4===0) { const n = MELO[bar][b/4]; [-5,5].forEach(det => voice({mus:1, t0, f:NOTE(n), type:'sawtooth', det, dur:st*3.6, vol:.035, att:.04, ft:'lowpass', ff:1600, vib:5, vibd:10, rev:.5})); }
   } else {
    if(b===0){
     B.choir(t0 - c.currentTime, ch.map(n => n+12), st*16*1.1, .045, true);
     voice({mus:1, t0, f:NOTE(ch[0]-24), type:'sawtooth', dur:st*16, vol:.07, att:.6, ft:'lowpass', ff:180, rev:.4});
     ch.forEach(n => [-12,12].forEach(det => voice({mus:1, t0, f:NOTE(n-12), type:'sawtooth', det, dur:st*16.5, vol:.025, att:1, ft:'lowpass', ff:900, rev:.6})));
     B.taiko(t0 - c.currentTime, .7, true);
    }
    if(b===10) B.taiko(t0 - c.currentTime, .35, true);
    if(phrase%2===1 && b%4===0){ const n = MELO[bar][b/4] - 12; voice({mus:1, t0, f:NOTE(n), type:'triangle', dur:st*4.2, vol:.09, att:.06, vib:4.5, vibd:8, rev:.7}); voice({mus:1, t0, f:NOTE(n), type:'sawtooth', dur:st*4.2, vol:.025, att:.08, ft:'lowpass', ff:1200, rev:.7}); }
    if(phrase%2===0 && (b===4||b===12)) voice({mus:1, t0, f:NOTE(ch[(b/4)%3]+24), type:'sine', dur:1.4, vol:.035, rev:.9});
   }
  }
  MUS.step++; MUS.next += st;
 }
}

function fxBoom(){ const fx = fxEl(); fx.classList.remove('boom'); void fx.offsetWidth; fx.classList.add('boom'); }
function fxSparks(el, cols, n, dist=160){
 const fx = fxEl(), box = el.getBoundingClientRect();
 for(let k=0;k<n;k++){ const s = document.createElement('span'); s.className='spark';
  const ang = Math.random()*Math.PI*2, d = dist*.5+Math.random()*dist;
  s.style.cssText = `left:${box.left+box.width/2}px;top:${box.top+box.height/2}px;--c:${pick(cols)};--x:${Math.cos(ang)*d}px;--y:${Math.sin(ang)*d}px`;
  fx.appendChild(s); setTimeout(() => s.remove(), 1100); }
}
function fxRain(n){
 const fx = fxEl();
 for(let k=0;k<n;k++){ const s = document.createElement('span'); s.className='rain';
  s.style.cssText = `left:${Math.random()*100}vw;--t:${1.6+Math.random()*1.6}s;--d:${Math.random()*1.2}s;--s:${4+Math.random()*6}px;--r:${Math.random()*720-360}deg`;
  fx.appendChild(s); setTimeout(() => s.remove(), 4200); }
}

  if(r==='mythic'){ pkLater(() => { fxFlash('rgba(200,160,255,.85)', 800); fxBoom(); sfx('flip','legend'); }, 650); }
  const bn = document.getElementById('lgBanner'); bn.textContent = r==='mythic' ? 'ULTRA LÉGENDAIRE !' : 'LÉGENDAIRE !'; bn.classList.toggle('myth', r==='mythic'); bn.classList.remove('go'); void bn.offsetWidth; bn.classList.add('go'); }, r==='mythic'?2600:2100);

function isPortrait(){
 if(typeof screen==='undefined') return false;
 const sw = Math.min(screen.width||9999, screen.height||9999);
 if(sw < 760){ // téléphone : on se fie à l'orientation de l'écran, pas à la largeur de la page (qui peut gonfler sur iPhone)
  if(screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf('portrait')===0;
  if(typeof window.orientation==='number') return window.orientation % 180 === 0;
  return screen.height > screen.width;
 }
 return window.innerWidth < 760 && window.innerHeight > window.innerWidth;
}

const teamRarity = keys => { const cnt={}; keys.forEach(k=>cnt[CARDS[k].r]=(cnt[CARDS[k].r]||0)+1); return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]; };

const ARC_BONUS = [500,1000,1000,2000,2000,3000,3000];
function arcBonusCheck(){

 let tot = 0, names = [];
 DATA.story.forEach((arc,a) => {
  if(S.arcBonus[a] || !FIGHTS.filter(x => x.a===a).every(x => S.story.done[x.key])) return;
  S.arcBonus[a] = 1; const v = ARC_BONUS[a]||0; S.gold += v; tot += v; names.push('Arc '+(a+1));
 });

}

 <div class="scene-note" style="left:auto;right:1.5cqw">Touche un panneau pour combattre. La première victoire contre une équipe rapporte le gain complet, les suivantes la moitié.</div>

/* ---------- règles ---------- */
function vRules(){
 return `<div class="panel"><h1 style="font-size:40px">Règles</h1>
 <h3 style="font-size:22px;margin-top:10px">Le combat</h3>
 <p>Chaque équipe compte jusqu'à 6 cartes. Au début du combat, <b>3 cartes de chaque équipe sont tirées au hasard</b> : ce sont elles qui combattent. Si le combat dure plus de 5 tours, une <b>carte renfort</b> est tirée au hasard parmi les 3 restantes de chaque équipe au début du 6e tour.</p>
 <p>À ton tour, chacun de tes persos agit une fois : touche un perso, choisis <b>Attaque</b> ou <b>Spéciale</b>, puis la cible. Ensuite, c'est l'adversaire qui joue. La spéciale se recharge pendant le nombre de tours indiqué. Une équipe gagne quand tous les persos adverses en jeu sont K.O.</p>
 <h3 style="font-size:22px;margin-top:10px">Faiblesses</h3>
 <p>L'eau éteint le feu, le feu brûle l'herbe, l'herbe enveloppe l'air, l'air fait fuir l'ombre, l'ombre arrête l'électricité, l'électricité coupe l'eau. Frapper un élément faible fait <b>+30 dégâts</b>.</p>
 <h3 style="font-size:22px;margin-top:10px">Alliances</h3>
 <p>Elles se calculent sur les persos en jeu, et se recalculent à l'arrivée du renfort.</p>
 <p><b>Équipe</b> : 2 persos de la même équipe, +20 sur l'attaque. <b>Camp</b> : 3 persos du même camp (gentil ou méchant), +20 PV. <b>Type</b> : 2 persos du même élément, +20 PV. <b>Matt + Zoé</b> (après l'arc Rivalité) : +20 sur l'attaque.</p>
 <p class="muted">Le blason sur chaque carte indique le camp : ${campIcon('gentil',18)} allié (gentil), ${campIcon('mechant',18)} ennemi (méchant). Gentils : Vagabonds, Ferrailleurs, Zénith, Rats du Canal, Bras Cassés, Garde d'Argent, l'Ancien. Méchants : Sang Noir, Dés Pipés, Crânes Rouges, le Conseil, Héritiers, Paillettes.</p>
 <h3 style="font-size:22px;margin-top:10px">Stades</h3>
 <p>Dès le début du combat, un Stade est tiré au hasard parmi les tiens et ceux de l'adversaire. Île Céleste : +20 / −20 sur l'attaque. Le Four : +40 / −40 PV. Le bonus va à l'élément du Stade, le malus à l'élément qu'il bat. Le renfort en profite aussi.</p>
 <h3 style="font-size:22px;margin-top:10px">Gains</h3>
 <p>Victoire contre une équipe commune 100, rare 200, ultra rare 350, légendaire 500. Défaite : 20. Rejouer un combat déjà gagné donne la moitié.</p></div>`;
}

/* ================= COMBAT ================= */
let C = null;
function mkFighter(k, side, lvl){
 const c = CARDS[k];
 const L = lvl||1, pv = c.pv + (LVPV[L]||0);
 return {k, c, side, hp:pv, max:pv, atkB:LVAT[L]||0, aAtk:0, aPv:0, cd:0, lvl:lvl||1, acted:false, stun:0, silence:0, miss:0, atkDown:0, vuln:null, dots:[], shield:0, dodge:0, hide:0, reflect:0, revived:false, dead:false, tmp:0};
}
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function alliances(side, announce){
 const F = C[side].filter(f => !f.dead);
 const cnt = (fn) => { const m = {}; F.forEach(f => { const v = fn(f); m[v] = (m[v]||0)+1; }); return m; };
 const teams = cnt(f => f.c.team), camps = cnt(f => DATA.camp[f.c.team]), els = cnt(f => f.c.el);
 const mz = side==='p' && S.story.zoe && F.some(f => base(f.k)==='Matt') && F.some(f => base(f.k)==='Zoe');
 const msgs = new Set();
 F.forEach(f => {
  let atk = 0, pv = 0;
  if(teams[f.c.team]>=2){ atk += 20; msgs.add(`alliance d'équipe ${f.c.team} (+20 attaque)`); }
  const camp = DATA.camp[f.c.team];
  if(camps[camp]>=3){ pv += 20; msgs.add(`alliance des ${camp==='gentil'?'gentils':'méchants'} (+20 PV)`); }
  if(els[f.c.el]>=2){ pv += 20; msgs.add(`alliance ${EL[f.c.el].n} (+20 PV)`); }
  if(mz && (base(f.k)==='Matt' || base(f.k)==='Zoe')){ atk += 20; msgs.add('alliance Matt + Zoé (+20 attaque)'); }
  f.atkB += atk - f.aAtk; f.aAtk = atk;
  const d = pv - f.aPv; f.max += d; f.hp = Math.max(1, f.hp + d); f.aPv = pv;
 });
 if(announce) msgs.forEach(m => L(`${side==='p'?'Toi':'Adversaire'} : ${m}`, 's'));
}
function applyStade(f){
 if(!C.stade) return;
 const s = CARDS[C.stade], haut = s.monde==='haut';
 if(s.el==='multi'){ if(haut) f.atkB += 10; else { f.max += 20; f.hp += 20; } return; }
 const sign = f.c.el===s.el ? 1 : f.c.el===BEATS[s.el] ? -1 : 0;
 if(!sign) return;
 if(haut) f.atkB += 20*sign; else { f.max = Math.max(1, f.max + 40*sign); f.hp = Math.max(1, Math.min(f.max, f.hp + 40*sign)); }
}
function startCombat(ctx){
 let ekeys, world, hpx = 1, elv = 1;
 if(ctx.type==='story'){ const F = FIGHTS[ctx.i]; ekeys = F.f.team; world = DATA.story[F.a].w; hpx = F.f.hp || 1; elv = F.f.lvl || 1; }
 else if(ctx.type==='event'){ const E = DATA.events[ctx.i]; ekeys = E.team; world = E.w; hpx = E.hp || 1; elv = E.lvl || 1; }
 else { ekeys = DATA.teams[ctx.id]; world = DATA.free.find(f => f[0]===ctx.id)[2]; }
 const pk = shuffle(S.team), ek = shuffle(ekeys);
 C = {ctx, world, p: pk.slice(0,3).map(k => mkFighter(k,'p', own(k)?own(k).lvl:1)), e: ek.slice(0,3).map(k => mkFighter(k,'e',elv)),
  bench:{p:pk.slice(3), e:ek.slice(3)}, round:1, phase:'p', sel:null, mode:null, logs:[], stade:null, inv:{p:0,e:0}, half:{p:0,e:0}, over:null, rar:teamRarity(ekeys), busy:false};
 if(hpx!==1) C.e.forEach(f => { f.max=Math.round(f.max*hpx); f.hp=f.max; });
 L(`Combat contre ${ctx.type==='event' ? DATA.events[ctx.i].nom.replace(/^Bats /,'') : CARDS[ekeys[0]].team}${elv>1?' (niveau '+elv+')':''} ! Cartes tirées : ${C.p.map(f=>f.c.nom).join(', ')} contre ${C.e.map(f=>f.c.nom).join(', ')}.`, 's');
 const enemyStades = shuffle(STADES.filter(s => s.monde===world && s.el!=='multi')).slice(0,2).map(s=>s.k);
 const pool = STADES.filter(s => own(s.k)).map(s=>s.k).concat(enemyStades);
 if(pool.length){ C.stade = pick(pool); L(`Stade tiré : ${CARDS[C.stade].nom} !`, 's'); [...C.p, ...C.e].forEach(applyStade); }
 alliances('p', true); alliances('e', true);
 view = 'combat'; render();
}
function reinforce(){
 ['p','e'].forEach(side => {
  if(!C.bench[side].length) return;
  const k = pick(C.bench[side]); C.bench[side] = C.bench[side].filter(x => x!==k);
  const sf = side!=='e' ? null : C.ctx.type==='story' ? FIGHTS[C.ctx.i].f : C.ctx.type==='event' ? DATA.events[C.ctx.i] : null;
  const f = mkFighter(k, side, side==='p' && own(k) ? own(k).lvl : sf ? (sf.lvl||1) : 1);
  if(sf){ const hpx = sf.hp || 1; f.max=Math.round(f.max*hpx); f.hp=f.max; }
  f._new = true; C[side].push(f); applyStade(f);
  L(`Renfort ${side==='p'?'pour toi':'adverse'} : ${f.c.nom} entre en jeu !`, 's');
  alliances(side, true);
 });
}
const alive = side => C[side].filter(f => !f.dead);
function spState(f){
 const sp = f.c.sp;
 if(sp.t==='passive') return 'Passive';
 if(f.cd>=90) return 'Déjà utilisée';
 if(f.cd>0) return `Recharge : ${f.cd} tour${f.cd>1?'s':''}`;
 if(f.silence) return 'Bloquée';
 if(sp.t==='shield1' && !alive(f.side).some(x => x!==f)) return 'Aucun allié à protéger';
 return null;
}
function atkVal(f){
 let v = f.c.ad + f.atkB + f.tmp;
 return Math.max(0, v);
}
function spVal(f, v){ return v + (LVLB[f.lvl]||0); }
function weakBonus(a, t, noweak){ return (!noweak && BEATS[a.c.el]===t.c.el) ? 30 : 0; }
function needsTarget(t){ return ['dmg','four','stun','dot','steal','silence','confuse','miss','atkdown','vuln','double','multi'].includes(t) ? 'enemy' : ['heal1','shield1'].includes(t) ? 'ally' : null; }
function L(t, cls){ C.logs.push([t, cls]); }
function fxq(o){ if(C) (C.fx || (C.fx = [])).push(o); }
function hit(a, t, amount, o={}){
 if(t.dead) return 0;
 const who = a.side==='p'?'p':'e';
 if(!o.sure && a.miss){ a.miss = 0; L(`${a.c.nom} rate son attaque !`, who); fxq({t:'txt', f:t, s:'Raté'}); return 0; }
 if(o.chance && Math.random() > o.chance){ L(`${a.c.nom} rate son coup…`, who); fxq({t:'txt', f:t, s:'Raté'}); return 0; }
 amount = Math.max(0, amount - a.atkDown); a.atkDown = 0;
 amount += weakBonus(a, t, o.noweak);
 if(t.vuln) amount += t.vuln.v;
 if(!o.pierce){
  if(t.reflect){ t.reflect = 0; L(`${t.c.nom} renvoie l'attaque !`, who); return dmg(t, a, amount); }
  if(t.dodge && !o.sure){ t.dodge = 0; L(`${t.c.nom} esquive !`, who); fxq({t:'txt', f:t, s:'Esquive'}); return 0; }
  if(t.shield){ t.shield = 0; L(`${t.c.nom} est protégé : aucun dégât`, who); fxq({t:'txt', f:t, s:'Bloqué'}); return 0; }
  if(C.inv[t.side]){ L(`${t.c.nom} est protégé : aucun dégât`, who); fxq({t:'txt', f:t, s:'Bloqué'}); return 0; }
  if(C.half[t.side]) amount = Math.floor(amount/2);
 }
 return dmg(a, t, amount);
}
function dmg(a, t, amount){
 t.hp -= amount; t._hit = true; fxq({t:'dmg', f:t, v:amount});
 L(`${a?a.c.nom+' → ':''}${t.c.nom} : −${amount} PV`, a? (a.side==='p'?'p':'e') : 's');
 if(t.hp <= 0) ko(t, a);
 return amount;
}
function heal(f, v){ if(f.dead) return; const h = Math.min(v, f.max - f.hp); f.hp += h; L(`${f.c.nom} récupère ${h} PV`, f.side); fxq({t:'heal', f, v:h}); }
function ko(t, a){
 if(base(t.k)==='Bastian' && !t.revived){ t.revived = true; t.hp = 200; L(`${t.c.nom} renaît de ses cendres avec 200 PV !`, 's'); return; }
 t.hp = 0; t.dead = true; t._koFresh = true; L(`${t.c.nom} est K.O. !`, 's'); fxq({t:'ko', f:t});
}
function lowest(side){ return alive(side).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0]; }
function doAction(f, mode, tgt){
 const os = f.side==='p'?'e':'p';
 f.acted = true; fxq({t:'act', f, mode, tgt});
 if(mode==='atk'){
  L(`${f.c.nom} utilise ${f.c.an}`, f.side);
  hit(f, tgt, atkVal(f));
  return;
 }
 const sp = f.c.sp, v = sp.v ? spVal(f, sp.v) : 0, o = {pierce:sp.pierce, sure:sp.sure, chance:sp.chance, noweak:sp.noweak};
 L(`${f.c.nom} lance ${f.c.sn} !`, f.side);
 f.cd = f.c.rc >= 99 ? 99 : Math.max(1, f.c.rc - (f.lvl>=5?1:0));
 switch(sp.t){
  case 'dmg': { const d = hit(f, tgt, v, o);
   if(sp.stun && !tgt.dead && d>0){ tgt.stun = 1; L(`${tgt.c.nom} passe son prochain tour`, f.side); }
   if(sp.silence && !tgt.dead){ tgt.silence = 1; L(`${tgt.c.nom} ne peut plus utiliser sa spéciale au prochain tour`, f.side); }
   if(sp.shield){ const al = lowest(f.side); if(al){ al.shield = 1; L(`${al.c.nom} est protégé de la prochaine attaque`, f.side); } }
   if(sp.teaminv){ C.inv[f.side] = 1; L(`Toute l'équipe est protégée pendant 1 tour`, f.side); }
   if(sp.healMatt){ const m = C[f.side].find(x => base(x.k)==='Matt' && !x.dead); if(m) heal(m, sp.healMatt); }
   if(sp.dot && !tgt.dead && d>0){ tgt.dots.push({v:sp.dot, n:sp.dotn}); L(`${tgt.c.nom} est empoisonné : ${sp.dot} PV par tour`, f.side); }
   if(sp.dodge){ f.dodge = 1; L(`${f.c.nom} esquivera la prochaine attaque`, f.side); }
   if(sp.self){ dmg(null, f, sp.self); }
   break; }
  case 'four': { const r = Math.floor(Math.random()*4), nm = ['la rieuse','la colérique','l\'endormie','la sage'][r];
   L(`Une des quatre voix de ${f.c.nom} prend la parole : ${nm} !`, f.side);
   if(r===1) hit(f, tgt, spVal(f, 200), o);
   else if(r===0) alive(f.side).forEach(t => heal(t, spVal(f, 60)));
   else if(r===2){ tgt.stun = 1; L(`${tgt.c.nom} passe son prochain tour`, f.side); }
   else alive(os).forEach(t => hit(f, t, spVal(f, 50), o));
   break; }
  case 'multi': for(let i=0;i<sp.n;i++){ const t = tgt.dead ? alive(os)[0] : tgt; if(t) hit(f, t, v, o); } break;
  case 'double': for(let i=0;i<2;i++){ const t = tgt.dead ? alive(os)[0] : tgt; if(t) hit(f, t, atkVal(f)); } break;
  case 'aoe': alive(os).forEach(t => hit(f, t, v, o)); if(sp.teaminv){ C.inv[f.side] = 1; L(`Toute l'équipe est protégée pendant 1 tour`, f.side); } if(sp.cdup){ alive(os).forEach(t => { if(t.cd < 90) t.cd += 1; }); L(`La recharge des spéciales adverses augmente d'1 tour`, f.side); } break;
  case 'heal1': heal(tgt, v); break;
  case 'healself': heal(f, v); break;
  case 'healteam': alive(f.side).forEach(t => heal(t, v)); break;
  case 'stun': if(sp.chance && Math.random()>sp.chance){ L(`… mais ça ne marche pas`, f.side); break; } tgt.stun = 1; L(`${tgt.c.nom} passe son prochain tour`, f.side); break;
  case 'stunall': alive(os).forEach(t => t.stun = 1); L(`Tous les adversaires passent leur prochain tour`, f.side); break;
  case 'dot': tgt.dots.push({v, n:sp.n}); L(`${tgt.c.nom} subira ${v} PV par tour`, f.side); break;
  case 'dotall': alive(os).forEach(t => t.dots.push({v, n:sp.n})); L(`Tous les adversaires subiront ${v} PV par tour`, f.side); break;
  case 'steal': { const d = hit(f, tgt, v, o); if(d>0) heal(f, d); if(sp.stun && !tgt.dead){ tgt.stun = 1; L(`${tgt.c.nom} passe son prochain tour`, f.side); } break; }
  case 'silence': tgt.silence = 1; L(`${tgt.c.nom} perd sa spéciale pour 1 tour`, f.side); break;
  case 'reflect': f.reflect = 1; L(`${f.c.nom} renverra la prochaine attaque`, f.side); break;
  case 'cdup': alive(os).forEach(t => { if(t.cd < 90) t.cd += 1; }); L(`La recharge des spéciales adverses augmente d'1 tour`, f.side); break;
  case 'confuse': { const allies = alive(tgt.side).filter(x => x!==tgt); if(allies.length){ const vic = pick(allies); L(`${tgt.c.nom}, hypnotisé, attaque ${vic.c.nom} !`, f.side); hit(tgt, vic, atkVal(tgt)); } else L(`… mais personne d'autre à attaquer`, f.side); break; }
  case 'teaminv': C.inv[f.side] = 1; L(`Toute l'équipe est protégée pendant 1 tour`, f.side); break;
  case 'teamhalf': C.half[f.side] = 1; L(`Toute l'équipe prend moitié moins de dégâts pendant 1 tour`, f.side); break;
  case 'shield1': tgt.shield = 1; L(`${tgt.c.nom} est protégé de la prochaine attaque`, f.side); break;
  case 'dodge': f.dodge = 1; L(`${f.c.nom} esquivera la prochaine attaque`, f.side); break;
  case 'hide': f.hide = 1; L(`${f.c.nom} ne peut pas être ciblé pendant 1 tour`, f.side); break;
  case 'miss': tgt.miss = 1; L(`${tgt.c.nom} ratera sa prochaine attaque`, f.side); break;
  case 'atkdown': tgt.atkDown = sp.v; L(`${tgt.c.nom} perd ${sp.v} sur sa prochaine attaque`, f.side); break;
  case 'vuln': tgt.vuln = {v, n:sp.n}; L(`${tgt.c.nom} prend +${v} de dégâts pendant ${sp.n} tours`, f.side); break;
 }
}
function canAct(f){ return !f.dead && !f.acted && !f.stun; }
function targetable(side){ const a = alive(side); const t = a.filter(f => !f.hide); return t.length ? t : a; }
function checkEnd(){
 if(C.over) return true;

    if(['aoe','stunall','dotall','cdup'].includes(sp)) targets = alive(ev.f.side==='p'?'e':'p');
    else if(['healteam','teaminv','teamhalf'].includes(sp)) targets = alive(ev.f.side);
    else if(!ev.tgt) targets = [ev.f];
    const hitAt = base + 1250;
    targets.forEach((tg,i) => {
     if(tg!==ev.f){ later(() => projectile(ev.f, tg, elmt, 360), base + 880 + i*60); if(i===0) sfxAt(base+880, 'throw', 0, elmt); }
     later(() => { burstAt(tg, elmt, tg.side!==ev.f.side); }, hitAt + i*60);
    });
    if(targets.some(tg => tg.side!==ev.f.side)){ later(() => shakeArena(true), hitAt); sfxAt(hitAt, 'impact', elmt); }
    else if(['heal1','healself','healteam'].includes(sp)) sfxAt(hitAt, 'heal'); else sfxAt(hitAt, 'shimmer');
    tm = hitAt; end = hitAt + 500 + targets.length*60;
   }
  } else if(ev.t==='dmg'){
   const d = tm + hitN*190;
   if(hitN>0 && actF && ev.f.side!==actF.side){ later(() => { mode==='atk' ? slashAt(ev.f, ELC[elmt]) : burstAt(ev.f, elmt, false); }, d); sfxAt(d, mode==='atk'?'slash':'hit'); }
   sfxAt(d, 'hit');
   hitN++;
   popAt(ev.f, '−'+ev.v, 'dm', d);
   later(() => { const el = fEl(ev.f); if(el){ el.classList.remove('hitfx'); void el.offsetWidth; el.classList.add('hitfx'); } }, d);
   end = Math.max(end, d + 450);
  } else if(ev.t==='heal'){ const d = tm + (hitN++)*190; sfxAt(d, 'heal'); popAt(ev.f, '+'+ev.v, 'hl', d); later(() => burstAt(ev.f, 'herbe', false), d); end = Math.max(end, d+450);
  } else if(ev.t==='txt'){ const d = tm + (hitN++)*190; sfxAt(d, 'miss'); popAt(ev.f, ev.s, 'tx', d); end = Math.max(end, d+450);
  } else if(ev.t==='ko'){ const d = tm + hitN*190 + 150; sfxAt(d, 'ko'); later(() => { const el = fEl(ev.f); if(el){ el.classList.add('dying'); burstAt(ev.f, 'ombre', true); } }, d); end = Math.max(end, d+800); }
 });
 C.animUntil = Date.now() + end;
}
function playerClickFighter(id){
 if(!C || C.over || C.phase!=='p' || C.busy || Date.now() < (C.animUntil||0)) return;
 const side = id[0], f = C[side][+id.slice(1)];
 const need = needsTargetFor();
 if(need){
  if((need==='enemy' && side==='e' && targetable('e').includes(f)) || (need==='ally' && side==='p' && !f.dead && !(C.mode==='sp' && C.sel.c.sp.t==='shield1' && f===C.sel))){
   doAction(C.sel, C.mode, f); C.sel = null; C.mode = null;
   if(checkEnd()) return;
   if(!C.p.some(canAct)){ render(); endPhase('p'); setTimeout(enemyPhase, animWait(400)); return; }
   render();
  }
  return;
 }
 if(side==='p' && canAct(f)){ C.sel = f; C.mode = null; render(); }
}
function chooseMode(m){
 const f = C.sel; if(!f) return;
 if(m==='sp' && spState(f)) return;
 const need = m==='atk' ? 'enemy' : needsTarget(f.c.sp.t);
 if(!need){ doAction(f, m, null); C.sel = null; if(checkEnd()) return; if(!C.p.some(canAct)){ render(); endPhase('p'); setTimeout(enemyPhase,animWait(400)); return; } render(); return; }
 C.mode = m; render();
}

/* ---------- événements ---------- */
document.addEventListener('click', e => {
 const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
 const fe = e.target.closest('[data-f]'); if(fe && view==='combat' && fe.classList.contains('fighter')){ playerClickFighter(fe.dataset.f); return; }
 if(e.target.closest('.btn,.tabs button,.quad,.mk,.fb,.isle')) sfx('click');
 const a = e.target.closest('[data-act]');
 const cardEl = e.target.closest('[data-card]');
 if(!a && cardEl && !cardEl.closest('.viewer')){ const all = [...document.querySelectorAll('#app [data-card]')].map(x => x.dataset.card); VW.list = [...new Set(all)]; detailModal(cardEl.dataset.card); return; }
 if(!a) return;
 const act = a.dataset.act;
 if(act==='bg' && e.target!==a) return;
 switch(act){
  case 'close': closeModal(); break;
  case 'bg': if(performance.now() - (VW.dragEnd||0) > 350) closeModal(); break;
  case 'vwprev': vwGo(-1); break;
  case 'vwnext': vwGo(1); break;
  case 'vwflip': VW.spin = false; VW.vy = 0; VW.ry = Math.round(VW.ry/180)*180 + 180; sfx('swoosh'); { const c = document.getElementById('vwCard'); if(c){ c.style.transition = 'transform .6s cubic-bezier(.3,1.3,.5,1)'; vwApply(); setTimeout(() => c.style.transition = '', 620); } } break;
  case 'vwspin': VW.spin = !VW.spin; a.classList.toggle('on', VW.spin); break;
  case 'savebox': saveBox(); break;
  case 'cfilter': collFilter = a.dataset.f; render(); break;
  case 'savecopy': { const ta = document.getElementById('saveCode'); ta.select(); try{ navigator.clipboard ? navigator.clipboard.writeText(ta.value).then(() => toast('Code copié')) : (document.execCommand('copy'), toast('Code copié')); }catch(e){ document.execCommand('copy'); toast('Code copié'); } break; }
  case 'saveload': { const v = (document.getElementById('loadCode').value||'').trim(); const er = document.getElementById('loadErr');
   if(!v){ er.textContent = 'Colle d\'abord un code.'; break; }
   try{ const o = JSON.parse(decodeURIComponent(escape(atob(v)))); if(!o || typeof o.gold!=='number' || !o.owned) throw 0; S = migrate(o); save(); closeModal(); toast('Partie chargée'); render(); }
   catch(e){ er.textContent = 'Ce code ne fonctionne pas. Vérifie qu\'il est complet.'; } break; }
  case 'enter': homeStage = 'menu'; sfx('shimmer'); render(); break;
  case 'tmus': sndToggle('mus'); break;
  case 'tsfx': sndToggle('sfx'); break;
  case 'evfight': { if(!S.team.length){ toast('Forme d\'abord ton équipe'); break; } startCombat({type:'event', i:+a.dataset.i}); break; }
  case 'retry': { const cx = C.ctx; C = null; startCombat(cx.type==='story' ? {type:'story', i:cx.i} : cx); break; }
  case 'pull': doPull(a.dataset.p); break;
  case 'popen': packOpen(); break;
  case 'pflip': packTap(+a.dataset.i); break;
  case 'pskip': packSkip(); break;
  case 'pdone': packDone(); break;
  case 'up': { const p = lastPull[+a.dataset.i]; const o = own(p.k); o.lvl = Math.min(5, o.lvl+1); o.n--; p.done = true; p.res = `Niveau ${o.lvl}`; save(); render(); break; }
  case 'sell': { const p = lastPull[+a.dataset.i]; const o = own(p.k), v = SELL[CARDS[p.k].r]||10; o.n--; S.gold += v; p.done = true; p.res = 'Vendue +'+v; save(); render(); break; }
  case 'add': closeModal(); teamAdd(a.dataset.k); break;
  case 'rm': closeModal(); S.team = S.team.filter(k => k!==a.dataset.k); save(); render(); break;
  case 'cap': S.team = [a.dataset.k, ...S.team.filter(k => k!==a.dataset.k)]; save(); render(); break;
  case 'fight': closeModal(); startStoryFight(+a.dataset.i); break;
  case 'arc': arcModal(+a.dataset.a); break;
  case 'arcnext': toast('Le prochain arc reste à écrire…'); break;
  case 'fpage': freePage = +a.dataset.p; render(); break;
  case 'free': if(!S.team.length) toast('Forme d\'abord ton équipe'); else startCombat({type:'free', id:a.dataset.id}); break;
  case 'dnext': D.i++; render(); window.scrollTo(0, document.body.scrollHeight); break;
  case 'dskip': D.i = D.lines.length-1; render(); break;
  case 'dend': { const t = D.then; D = null; t(); break; }
  case 'atk': chooseMode('atk'); break;
  case 'sp': chooseMode('sp'); break;
  case 'cancel': C.sel = null; C.mode = null; render(); break;
  case 'endturn': C.sel = null; C.mode = null; endPhase('p'); enemyPhase(); break;
  case 'flee': finish(false, true); break;
  case 'cend': afterCombat(); break;
  case 'reset': modal(`<h2 style="font-size:30px">Recommencer ?</h2><p>Ta collection, tes pièces et ta progression seront effacées.</p><div class="row"><button class="btn" data-act="reset2">Oui, recommencer</button><button class="btn sec" data-act="close">Annuler</button></div>`); break;
  case 'reset2': S = newSave(); lastPull = null; save(); closeModal(); go('home'); break;
 }
});
document.addEventListener('change', e => { if(e.target.matches('[data-act="filter"]')){ collFilter = e.target.value; render(); } if(e.target.matches('[data-act="tfilter"]')){ teamFilter = e.target.value; render(); } });
render();
</script>
